<body class="selection:bg-[#004AD7] selection:text-white">
  
  <div id="root"></div>

  <!-- Global Error Logger Fallback -->
  <script>
    window.onerror = function(msg, url, lineNo, columnNo, error) {
      const root = document.getElementById('root');
      if (root && (!root.innerHTML || root.innerHTML.trim() === '')) {
        root.innerHTML = '<div style="padding:40px;color:#f87171;background:#0f172a;font-family:monospace;border:1px solid #ef4444;margin:20px;border-radius:12px;">' +
          '<h2 style="font-size:20px;margin-bottom:10px;">⚠️ 스크립트 실행 오류가 발생했습니다</h2>' +
          '<p>오류 내용: ' + msg + '</p>' +
          '<p>위치: Line ' + lineNo + ', Col ' + columnNo + '</p>' +
          '</div>';
      }
      return false;
    };
  </script>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    /* Base SVG Icon Component */

        strokeLinecap="round"
        strokeLinejoin="round"
        className={className}
        {...props}
      >
        {children}
      </svg>
    );

    /* Essential SVG Icons */
    const ShieldCheck = (props) => (

        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10" />

    const Cpu = (props) => (

    const ChevronRight = (props) => (
      <IconBase {...props}>
        <path d="m9 18 6-6-6-6" />
      </IconBase>
    );
    const ChevronLeft = (props) => (

      stoneSkipperAction: "images/stoneskip_action.webp",
      gameP2e: "images/stoneskipper.jpg",
      p2eVideo: "images/stoneskipperplay.mp4",
      d2cMall: "images/d2c_mall_pillar02.webp",
      d2cHero: "images/D2C_mall_hero.webp",
      hanulLand: "images/hanul_land_pillar03.webp",
      hanulDay: "images/hanul_land_herosection.webp",
      hanulNight: "https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=1600&q=85",
      nodeServer: "images/nodeserver.png"
    };

    function App() {
      const [currentView, setCurrentView] = useState('overview');
      const [isWalletOpen, setIsWalletOpen] = useState(false);
      const [wallet, setWallet] = useState(null);
      const [walletBalance, setWalletBalance] = useState({ usdt: 5000, xnot: 0 });
      const [ownedNodes, setOwnedNodes] = useState(0);
      const [toastMessage, setToastMessage] = useState(null);
      const [hanulMode, setHanulMode] = useState('day');

      /* Financial Simulator State */
      const [simNodes, setSimNodes] = useState(1);
      const [simUsers, setSimUsers] = useState('3m');
      const [simD2c, setSimD2c] = useState('5k');
      const [simHanul, setSimHanul] = useState('target72');
      const [buyQuantity, setBuyQuantity] = useState(1);

      /* Hero Carousel State (3초 자동 롤링 + 부드러운 페이드) */
      const [heroIndex, setHeroIndex] = useState(0);
      const [isHovered, setIsHovered] = useState(false);

      const heroSlides = [
        {
          id: 0,
          badge: "PILLAR 01 • TRAFFIC & AIRDROP",
          subBadge: "10억 텔레그램 P2E 트래픽",
          title: "Stone Skipper P2E 게임 &\n50,000 XNOT 코인 즉시 에어드랍",
          desc: "텔레그램 1초 간편 온보딩과 럭키 드로우 바이럴 마케팅으로 폭발적 유저 유입. 구글 애드센스 실제 광고 수익 50%를 노드 홀더에게 매월 분배하며, 구매 즉시 5만 XNOT 코인을 지갑으로 에어드랍합니다.",
          primaryBtn: "노드 구매 및 5만 XNOT 수령",
          primaryAction: () => setCurrentView('nodes'),
          secondaryBtn: "Pillar 01 상세 정보",
          secondaryAction: () => setCurrentView('pillar1'),
          mediaType: "phone",
          imgSrc: ASSETS.gameP2e
        },
        {
          id: 1,
          badge: "PILLAR 02 • D2C REWARD COMMERCE",
          subBadge: "50% 독점 도매 마진권",
          title: "D2C 리워드 쇼핑몰 &\n기여도 리워드 (24,000 + 16,000원)",
          desc: "아사이베리·과라나 등 30종 천연 원료 명품 건기식. 소비자가 238,000원 기준 50% 독점 도매 마진권(119,000원)을 부여하고 1단계 레퍼럴 24,000원 + 2단계 팀 기여 16,000원 및 월 1억~5억 배당 풀을 노드에 적립합니다.",
          primaryBtn: "D2C 쇼핑몰 상세 보기",
          primaryAction: () => setCurrentView('pillar2'),
          secondaryBtn: "재무 시뮬레이터",
          secondaryAction: () => setCurrentView('terminal'),
          mediaType: "banner",
          imgSrc: ASSETS.d2cHero
        },
        {
          id: 2,
          badge: "PILLAR 03 • 3.17만 평 RWA RESORT",
          subBadge: "실물 영업이익 20% 영구 배당",
          title: "제주 한울랜드 2.0 (Day & Night) &\n사계절 체류형 복합 리조트 RWA",
          desc: "겨울~봄 비수기를 없애는 대규모 수선화 축제·베이커리 카페와 야간 스타나이트 감성 야시장 & 드론쇼. 검증된 실물 리조트 영업이익의 20%를 3,000개 마스터 노드에 매월 투명하게 영구 배당합니다.",
          primaryBtn: "제주 한울랜드 2.0 IR 보기",
          primaryAction: () => setCurrentView('hanul'),
          secondaryBtn: "배당 계산기 검증",
          secondaryAction: () => setCurrentView('terminal'),
          mediaType: "banner",
          imgSrc: ASSETS.heroBg
        }
      ];

      /* 3초(3000ms) 자동 슬라이드 */
      useEffect(() => {
        if (isHovered) return;
        const timer = setInterval(() => {
          setHeroIndex(prev => (prev + 1) % heroSlides.length);
        }, 3000);
        return () => clearInterval(timer);
      }, [isHovered, heroSlides.length]);

      const notify = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 5000);
      };

      const handleConnect = (walletName) => {
        setWallet({
          name: walletName,
          address: '0x7F29...8E9D',
          chain: 'BNB Smart Chain (BEP20)'
        });
        setIsWalletOpen(false);
        notify(`지갑 연결 완료: ${walletName} (0x7F29...8E9D)`);
      };

      const executeBuyNode = () => {
        const cost = buyQuantity * 1000;
        if (!wallet) {
          setIsWalletOpen(true);
          return;
        }
        if (walletBalance.usdt < cost) {
          notify("USDT 잔액이 부족합니다.");
          return;
        }
        setWalletBalance(prev => ({
          usdt: prev.usdt - cost,
          xnot: prev.xnot + (buyQuantity * 50000)
        }));
        setOwnedNodes(prev => prev + buyQuantity);
        notify(`노드 ${buyQuantity}대 구매 완료! +${(buyQuantity * 50000).toLocaleString()} XNOT 에어드랍 전송 완료`);
      };

      /* Dynamic Yield Engine (20% 배당 반영) */
      const financialMetrics = useMemo(() => {
        let adsKRW = 54000;
        if (simUsers === '3m') adsKRW = 179000;
        if (simUsers === '10m') adsKRW = 748000;

        let d2cKRW = 40000;
        if (simD2c === '5k') d2cKRW = 69000;
        if (simD2c === '10k') d2cKRW = 139000;

        let hanulKRW = 11200;
        if (simHanul === 'y2') hanulKRW = 19800;
        if (simHanul === 'p8') hanulKRW = 26800;
        if (simHanul === 'target72') hanulKRW = 40000;

        const monthlyPerNode = adsKRW + d2cKRW + hanulKRW;
        const totalMonthlyKRW = monthlyPerNode * simNodes;
        const totalYearlyKRW = totalMonthlyKRW * 12;
        const totalMonthlyUSD = totalMonthlyKRW / 1350;
        const totalYearlyUSD = totalYearlyKRW / 1350;
        const principalKRW = simNodes * 1000 * 1350;
        const annualizedROI = ((totalYearlyKRW / principalKRW) * 100).toFixed(1);

        return {
          adsKRW,
          d2cKRW,
          hanulKRW,
          monthlyPerNode,
          totalMonthlyKRW,
          totalYearlyKRW,
          totalMonthlyUSD,
          totalYearlyUSD,
          annualizedROI,
          totalTokens: simNodes * 50000
        };
      }, [simNodes, simUsers, simD2c, simHanul]);

      useEffect(() => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }, [currentView]);

      return (
        <div className="min-h-screen bg-[#06070B] text-slate-100 font-sans antialiased">
          
          {/* Institutional Telemetry Bar */}
          <div className="bg-[#090A10] border-b editorial-grid-line text-[11px] font-mono-tech py-2 px-6">
            <div className="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3 text-slate-400">
              <div className="flex items-center gap-4">
                <span className="flex items-center gap-1.5 text-cyan-400 font-bold">
                  <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                  XNOT PROTOCOL : ONLINE
                </span>
                <span className="text-white/20">|</span>
                <span>Genesis Node Allocation: <strong className="text-white">1,842 / 3,000 (61.4%)</strong></span>
                <span className="hidden md:inline text-white/20">|</span>
                <span className="hidden md:inline text-slate-300">RWA Vault: <strong>제주 한울랜드 3.17만 평 (영업익 20%)</strong></span>
              </div>
              <div className="flex items-center gap-4">
                <span className="text-amber-400 font-semibold hidden sm:inline">⭐ 노드당 5만 XNOT 에어드랍</span>
                <button 
                  onClick={() => setCurrentView('nodes')}
                  className="text-cyan-400 hover:text-cyan-300 font-bold flex items-center gap-1 transition-colors cursor-pointer"
                >
                  스토어 바로가기 <ChevronRight className="w-3 h-3" />
                </button>
              </div>
            </div>
          </div>

          {/* Navigation Bar */}
          <header className="sticky top-0 z-40 bg-[#06070B]/90 backdrop-blur-xl border-b editorial-grid-line">
            <div className="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
              
              <div 
                onClick={() => setCurrentView('overview')}
                className="flex items-center gap-3 cursor-pointer group"
              >
                <img 
                  src="images/XNOTLOGO.png" 
                  alt="XNOT Logo" 
                  className="h-10 w-10 sm:h-11 sm:w-11 rounded-2xl object-contain shadow-md shrink-0 transition-transform group-hover:scale-105"
                />
                <div>
                  <div className="flex items-center gap-2">
                    <span className="font-black text-lg sm:text-xl tracking-tight text-white font-mono-tech">
                      XNOT WEB3 GLOBAL PROJECT
                    </span>
                    <span className="text-[10px] uppercase font-mono-tech font-bold tracking-widest px-2 py-0.5 rounded bg-cyan-500/10 text-cyan-400 border border-cyan-500/40">
                      V2.5
                    </span>
                  </div>
                  <span className="text-[10px] font-mono-tech text-slate-400 block uppercase tracking-wider">
                    INSTITUTIONAL WEB3 & RWA PROTOCOL
                  </span>
                </div>
              </div>

              {/* Navigation Tabs */}
              <nav className="hidden lg:flex items-center gap-1 bg-white/[0.03] p-1.5 rounded-full border editorial-grid-line">
                {[
                  { id: 'overview', label: '엔터프라이즈 개요' },
                  { id: 'pillar1', label: '01. 물수제비 P2E' },
                  { id: 'pillar2', label: '02. D2C 리워드몰' },
                  { id: 'hanul', label: '03. 제주 한울랜드 2.0' },
                  { id: 'nodes', label: '04. Gram Nodes 스토어' },
                  { id: 'terminal', label: '재무 시뮬레이터' },
                  { id: 'governance', label: '거버넌스' }
                ].map((route) => {
                  const isActive = currentView === route.id;
                  return (
                    <button
                      key={route.id}
                      onClick={() => setCurrentView(route.id)}
                      className={`px-4 py-2 rounded-full text-xs font-semibold transition-all cursor-pointer ${
                        isActive
                          ? 'bg-[#004AD7] text-white shadow-[0_0_20px_rgba(0,74,215,0.4)]'

              </nav>

              {/* Action Buttons */}
              <div className="flex items-center gap-3">
                {wallet ? (
                  <div className="flex items-center gap-3">
                    <div className="hidden sm:flex flex-col text-right font-mono-tech">
                      <div className="text-xs font-bold text-white tabular-nums">
                        {walletBalance.usdt.toLocaleString()} USDT
                      </div>
                      <div className="text-[10px] text-cyan-400">{wallet.address}</div>
                    </div>
                    <button
                      onClick={() => setWallet(null)}
                      className="px-3.5 py-2 rounded-xl text-xs font-semibold bg-white/5 hover:bg-rose-500/20 text-slate-300 hover:text-rose-300 border editorial-grid-line transition-all cursor-pointer"

                  <button
                    onClick={() => setIsWalletOpen(true)}
                    className="inline-flex items-center gap-2 px-5 py-2.5 rounded-xl font-bold text-xs uppercase tracking-wider text-white bg-[#004AD7] hover:bg-[#003cb0] shadow-[0_0_25px_rgba(0,74,215,0.4)] transition-all cursor-pointer"
                  >
                    <Wallet className="w-4 h-4" />
                    <span>지갑 연결</span>
                  </button>
                )}
              </div>

            </div>

            {/* Mobile Navigation Bar */}
            <div className="lg:hidden flex overflow-x-auto px-4 py-2 border-t editorial-grid-line bg-[#090A10] gap-2">
              {[
                { id: 'overview', label: '개요' },
                { id: 'pillar1', label: '01. 물수제비' },
                { id: 'pillar2', label: '02. D2C몰' },
                { id: 'hanul', label: '03. 제주 RWA' },
                { id: 'nodes', label: '04. 노드 스토어' },
                { id: 'terminal', label: '배당 시뮬레이터' },
                { id: 'governance', label: '거버넌스' }
              ].map(r => (
                <button
                  key={r.id}
                  onClick={() => setCurrentView(r.id)}
                  className={`px-3 py-1.5 rounded-lg text-xs font-bold whitespace-nowrap cursor-pointer ${

            </div>
          </header>

          {/* Toast Notification */}
          {toastMessage && (
            <div className="fixed bottom-6 right-6 z-50 max-w-md bg-[#0F1424] border border-[#004AD7] p-4 rounded-2xl shadow-2xl flex items-start gap-3">
              <CheckCircle2 className="w-5 h-5 text-cyan-400 shrink-0 mt-0.5" />
              <div>
                <div className="text-xs font-bold text-white font-mono-tech uppercase">SYSTEM DISPATCH</div>
                <div className="text-xs text-slate-300 mt-0.5">{toastMessage}</div>

          {/* Main Routing Views */}
          <main className="relative z-10 pb-28">
            
            {/* ========================================================================= */}
            {/* VIEW: OVERVIEW                                                            */}
            {/* ========================================================================= */}
            {currentView === 'overview' && (
              <div>
                
                {/* ------------------------------------------------------------- */}
                {/* 00. LANDING PAGE RESTORED TITLE HEADER                        */}
                {/* ------------------------------------------------------------- */}
                <div className="max-w-7xl mx-auto px-4 sm:px-6 pt-6 pb-0">
                  <div className="flex flex-col gap-1 pb-1">
                    <div className="flex items-center gap-2 text-cyan-400 font-mono-tech text-xs sm:text-sm font-bold tracking-widest uppercase">
                      <span className="text-base text-cyan-300">✦</span>
